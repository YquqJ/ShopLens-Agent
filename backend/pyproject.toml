[project]
name = "shoplens-agent"
version = "0.1.0"
description = "ShopLens 电商售前导购单 Agent（LangGraph + MCP 多源比价）"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Agent 编排 + MCP 工具接入（SPEC 锁定，勿随意更换）
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-mcp-adapters>=0.3",
    # FastMCP server（mcp.server.fastmcp，随官方 mcp SDK 提供）
    "mcp>=1.30",
    # Qwen（DashScope OpenAI 兼容）LLM 客户端
    "langchain-openai>=0.3",
    # Web（FastAPI + uvicorn，SSE 流式）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # 关系库（Postgres 异步，psycopg）
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2.0",
    # 配置与类型
    "pydantic-settings>=2.5.0",
    # 向量库（embedded 持久化，只做向量检索）
    "chromadb>=0.5.15",
    # DashScope OpenAI 兼容客户端（embedding / LLM 共用）
    "openai>=1.60",
    # 可靠性：重试/退避（tenacity）+ 观测（OpenTelemetry）
    "tenacity>=8.3",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

# 本目录是应用（非可分发库），依赖统一由 uv.lock 锁定
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
