services:
  postgres:
    image: postgres:16
    container_name: shoplens-postgres
    environment:
      POSTGRES_USER: shoplens
      POSTGRES_PASSWORD: shoplens
      POSTGRES_DB: shoplens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoplens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: